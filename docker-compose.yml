services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    # Keine Host-Ports: hinter Dokploys Traefik werden die Container ueber das
    # Docker-Netz per Host-Header erreicht, dafuer sind die Domains da. Ein
    # veroeffentlichter Port kollidiert dort ausserdem mit Dokploy selbst, das
    # auf 3000 laeuft. Fuer ein blosses `docker compose up` ohne Traefik siehe
    # docker-compose.local.yml.
    expose: ["8000"]
    environment:
      REDIS_URL: redis://redis:6379
      JUMPHEIGHTCALCULATOR_DATA: /data
    volumes: ["jumpheightcalculator-data:/data"]
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: ["arq", "jumpheightcalculator.worker.WorkerSettings"]
    environment:
      REDIS_URL: redis://redis:6379
      JUMPHEIGHTCALCULATOR_DATA: /data
    volumes: ["jumpheightcalculator-data:/data"]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        # Leer = Browser spricht Port 8000 desselben Hosts an (Heimnetz).
        # Hinter einem Reverse Proxy hier die oeffentliche API-Adresse eintragen,
        # z.B. https://jumpheightcalculator-api.dokploy.jonasleuenberger.com
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-}"
    restart: unless-stopped
    expose: ["3000"]
    environment:
      JUMPHEIGHTCALCULATOR_API: http://api:8000
    depends_on: [api]

volumes:
  jumpheightcalculator-data:
